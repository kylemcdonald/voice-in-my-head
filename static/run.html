<html>

<head>
  <meta charset="UTF-8">
  <title>Voice In My Head</title>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0'>
  <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
  <meta name='apple-mobile-web-app-capable' content='yes'>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@1,500&display=swap" rel="stylesheet">
  <script>
    // Configuration
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ];

    // State
    let pc = null;
    let ws = null;
    let localStream = null;
    let remoteAudio = null;
    let remoteStream = null;
    let pendingClientLogs = [];
    let started = false;

    // Warn before leaving the page
    window.addEventListener('beforeunload', (event) => {
      event.preventDefault();
      event.returnValue = 'Are you sure you want to exit?';
      return 'Are you sure you want to exit?';
    });

    function testMidway() {
      // Redirect to spin-up with test mode
      window.location.href = '/spin-up-session?test=1&l=en';
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // Show debug button on dev server
      if (window.location.hostname.includes('dev')) {
        const debugButton = document.getElementById('debug-button');
        debugButton.classList.remove('hidden');
      }

      // Show test button on dev server or when test=1 is in URL
      if (window.location.hostname.includes('dev') || window.location.search.includes('test=1')) {
        const testButton = document.getElementById('test-button');
        if (testButton) testButton.classList.remove('hidden');
      }

      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (!sessionId) {
        showError('Missing session_id');
        return;
      }

      try {
        await initWebRTC(sessionId);
      } catch (err) {
        console.error('Failed to initialize:', err);
        showError(err.message);
      }
    });

    function showError(message) {
      const button = document.getElementById('start-button');
      button.innerText = 'Error';
      button.classList.add('bg-red-500');
      console.error(message);
    }

    function logClient(message, extra = {}) {
      const payload = {
        event: 'client-log',
        message,
        extra,
      };

      console.log('[client-log]', payload);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'app-message',
          data: payload,
        }));
      } else {
        pendingClientLogs.push(payload);
      }
    }

    function flushClientLogs() {
      if (!ws || ws.readyState !== WebSocket.OPEN || pendingClientLogs.length === 0) {
        return;
      }

      for (const payload of pendingClientLogs) {
        ws.send(JSON.stringify({
          type: 'app-message',
          data: payload,
        }));
      }

      pendingClientLogs = [];
    }

    function ensureRemoteAudioElement() {
      if (remoteAudio) {
        return remoteAudio;
      }

      remoteAudio = document.createElement('audio');
      remoteAudio.id = 'remote-audio';
      remoteAudio.autoplay = true;
      remoteAudio.playsInline = true;
      remoteAudio.setAttribute('playsinline', '');
      remoteAudio.style.display = 'none';
      document.body.appendChild(remoteAudio);
      return remoteAudio;
    }

    async function tryStartRemoteAudio(reason) {
      const audio = ensureRemoteAudioElement();

      if (!audio.srcObject) {
        logClient('remote-audio-play-skipped', { reason, hasSrcObject: false });
        return;
      }

      try {
        await audio.play();
        logClient('remote-audio-play-ok', {
          reason,
          paused: audio.paused,
          currentTime: audio.currentTime,
        });
      } catch (err) {
        logClient('remote-audio-play-failed', {
          reason,
          name: err.name,
          message: err.message,
        });
      }
    }

    async function logAvailableDevices() {
      if (!navigator.mediaDevices?.enumerateDevices) {
        logClient('enumerate-devices-unsupported');
        return [];
      }

      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const simplifiedDevices = devices.map(device => ({
          kind: device.kind,
          label: device.label,
          deviceId: device.deviceId,
          groupId: device.groupId,
        }));
        logClient('media-devices', {
          devices: simplifiedDevices,
        });
        return devices;
      } catch (err) {
        logClient('enumerate-devices-failed', {
          name: err.name,
          message: err.message,
        });
        return [];
      }
    }

    function isIPhone() {
      return /iPhone/i.test(navigator.userAgent);
    }

    function scoreAudioInput(device) {
      const label = (device.label || '').toLowerCase();
      let score = 0;

      if (label.includes('airpods')) score += 100;
      if (label.includes('bluetooth')) score += 75;
      if (label.includes('beats')) score += 60;
      if (label.includes('headset') || label.includes('headphone')) score += 50;
      if (label.includes('iphone')) score -= 100;
      if (label.includes('default')) score -= 10;

      return score;
    }

    async function requestMicrophoneStream(audioConstraints = true) {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: audioConstraints,
      });

      const [audioTrack] = stream.getAudioTracks();
      logClient('microphone-access-granted', {
        label: audioTrack?.label,
        settings: audioTrack?.getSettings?.(),
      });
      return stream;
    }

    async function selectPreferredIPhoneAudioInput() {
      if (!isIPhone()) {
        return;
      }

      const devices = await logAvailableDevices();
      const audioInputs = devices
        .filter(device => device.kind === 'audioinput')
        .sort((a, b) => scoreAudioInput(b) - scoreAudioInput(a));

      if (audioInputs.length === 0) {
        logClient('iphone-audio-input-selection-skipped', {
          reason: 'no-audioinput-devices',
        });
        return;
      }

      const preferredDevice = audioInputs[0];
      logClient('iphone-audio-input-candidate', {
        label: preferredDevice.label,
        deviceId: preferredDevice.deviceId,
        score: scoreAudioInput(preferredDevice),
      });

      try {
        const replacementStream = await requestMicrophoneStream({
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          deviceId: { exact: preferredDevice.deviceId },
        });

        const replacementTrack = replacementStream.getAudioTracks()[0];
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        localStream = replacementStream;

        logClient('iphone-audio-input-selected', {
          label: replacementTrack?.label,
          settings: replacementTrack?.getSettings?.(),
        });
      } catch (err) {
        logClient('iphone-audio-input-selection-failed', {
          requestedLabel: preferredDevice.label,
          requestedDeviceId: preferredDevice.deviceId,
          name: err.name,
          message: err.message,
        });
      }
    }

    async function initWebRTC(sessionId) {
      ensureRemoteAudioElement();

      // Request microphone permission first
      console.log('Requesting microphone...');
      try {
        localStream = await requestMicrophoneStream({
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        });
        console.log('Got microphone access');
        await selectPreferredIPhoneAudioInput();
      } catch (err) {
        console.error('Microphone access denied:', err);
        showError('Microphone access required');
        return;
      }

      // Create WebSocket connection for signaling
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}/ws/${sessionId}`;
      console.log('Connecting to WebSocket:', wsUrl);

      ws = new WebSocket(wsUrl);
      window.ws = ws; // For debugging

      ws.onopen = () => {
        console.log('WebSocket connected');
        logClient('websocket-open', {
          userAgent: navigator.userAgent,
        });
        flushClientLogs();
      };

      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
        showError('Connection failed');
      };

      ws.onclose = () => {
        console.log('WebSocket closed');
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        console.log('Received:', msg.type);

        switch (msg.type) {
          case 'offer':
            await handleOffer(msg.sdp);
            break;
          case 'ice-candidate':
            await handleIceCandidate(msg);
            break;
          case 'app-message':
            handleAppMessage(msg.data);
            break;
          default:
            console.log('Unknown message type:', msg.type);
        }
      };
    }

    async function handleOffer(sdp) {
      console.log('Handling SDP offer');

      // Create peer connection
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      window.pc = pc; // For debugging

      // Add local tracks
      localStream.getTracks().forEach(track => {
        pc.addTrack(track, localStream);
        console.log('Added local track:', track.kind);
      });

      // Handle remote tracks (audio from server)
      pc.ontrack = (event) => {
        console.log('Got remote track:', event.track.kind);
        if (event.track.kind === 'audio') {
          const audio = ensureRemoteAudioElement();
          remoteStream = event.streams[0];
          audio.srcObject = remoteStream;
          logClient('remote-audio-track-received', {
            trackLabel: event.track.label,
            streamId: remoteStream.id,
            audioPaused: audio.paused,
          });
          tryStartRemoteAudio('track-received');
        }
      };

      // Handle ICE candidates
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          console.log('Sending ICE candidate');
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            candidate: event.candidate.candidate,
            sdpMid: event.candidate.sdpMid,
            sdpMLineIndex: event.candidate.sdpMLineIndex,
          }));
        }
      };

      // Handle connection state changes
      pc.onconnectionstatechange = () => {
        console.log('Connection state:', pc.connectionState);
        if (pc.connectionState === 'connected') {
          onConnected();
        } else if (pc.connectionState === 'failed') {
          showError('Connection failed');
        }
      };

      // Set remote description and create answer
      await pc.setRemoteDescription({ type: 'offer', sdp: sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      // Send answer
      ws.send(JSON.stringify({
        type: 'answer',
        sdp: answer.sdp,
      }));
      console.log('Sent SDP answer');
    }

    async function handleIceCandidate(msg) {
      if (!pc) return;

      try {
        await pc.addIceCandidate({
          candidate: msg.candidate,
          sdpMid: msg.sdpMid,
          sdpMLineIndex: msg.sdpMLineIndex,
        });
        console.log('Added ICE candidate');
      } catch (err) {
        console.warn('Failed to add ICE candidate:', err);
      }
    }

    function handleAppMessage(data) {
      console.log('App message received:', data);
      if (data.event === 'chat-msg') {
        addMessage(data.user, data.message);
      } else if (data.event === 'user-speaking') {
        console.log('Speaking event:', data.speaking);
        const emoji = document.getElementById('speaking-emoji');
        if (data.speaking) {
          emoji.classList.remove('hidden');
        } else {
          emoji.classList.add('hidden');
        }
      }
    }

    function onConnected() {
      console.log('WebRTC connected!');

      // Enable start button immediately
      const button = document.getElementById('start-button');
      button.innerText = 'Tap to Start';
      button.classList.remove('bg-gray-500');
      button.classList.add('bg-blue-500', 'hover:bg-blue-700');
      button.disabled = false;
    }

    function start() {
      logClient('start-tapped');
      logAvailableDevices();
      tryStartRemoteAudio('start-tap');

      // Send start message
      ws.send(JSON.stringify({
        type: 'app-message',
        data: { message: 'start' }
      }));

      const button = document.getElementById('start-button');
      button.classList.add('hidden');
      started = true;
    }

    function toggleDebug() {
      const debug = document.getElementById('debug-panel');
      debug.classList.toggle('hidden');
    }

    function addMessage(user, text) {
      const transcript = document.getElementById('transcript');
      const div = document.createElement('div');
      div.classList.add('p-3', 'm-1', 'rounded-lg', 'text-white');
      if (!started) {
        div.classList.add('opacity-25');
      }
      if (user === 'user') {
        div.classList.add('self-end', 'bg-blue-800', 'ml-10');
      } else {
        div.classList.add('self-start', 'bg-gray-800', 'mr-10');
      }
      div.innerText = text;
      transcript.appendChild(div);

      // Auto-scroll to bottom
      transcript.scrollTop = transcript.scrollHeight;
    }
  </script>
</head>

<body class="bg-black" style="overflow: hidden;">

  <!-- Speaking indicator overlay -->
  <div id="speaking-emoji" class="fixed top-4 left-1/2 -translate-x-1/2 text-6xl z-50 hidden bg-gray-900 rounded-xl p-2">
    🗣️
  </div>

  <div id="transcript"
    class="flex flex-col justify-end items-center fixed bottom-0 left-0 w-full h-full p-2 overflow-y-scroll">
  </div>

  <div id="debug-panel" class="hidden fixed top-16 left-0 w-full p-3 bg-gray-900 text-white font-mono text-sm">
    <p>WebRTC Connection</p>
    <p id="debug-state">State: initializing</p>
  </div>

  <div id="controls" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-4">
    <button id="start-button"
      class="bg-gray-500 text-white font-bold py-4 px-8 rounded font-mono italic rounded-xl text-5xl" disabled
      onclick="start()">
      Loading...
    </button>
    <button id="debug-button"
      class="hidden bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xl font-mono italic"
      onclick="toggleDebug()">
      Toggle Debug
    </button>
    <button id="test-button"
      class="hidden bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-xl text-xl font-mono italic"
      onclick="testMidway()">
      Test Midway
    </button>
  </div>

</body>

</html>
